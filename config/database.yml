default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  pragma:
    journal_mode: WAL
    synchronous: normal

queue_settings: &queue_settings
  <<: *default
  pragma:
    busy_timeout: 5000
    journal_mode: WAL
    synchronous: normal

development:
  primary:
    <<: *default
    database: site/db/development.sqlite3
  cache:
    <<: *default
    database: site/db/cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: site/db/queue.sqlite3
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default
    database: site/db/test.sqlite3
  cache:
    <<: *default
    database: site/db/test_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: site/db/test_queue.sqlite3
    migrations_paths: db/queue_migrate

production:
  primary:
    <<: *default
    database: /data/site/db/production.sqlite3
    url: <%= ENV["DATABASE_URL"] %>
  cable:
    <<: *default
    database: /data/site/db/production_cable.sqlite3
    migrations_paths: db/cable_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |url| url.path = "/data/site/db/production_cable.sqlite3" } if ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    database: /data/site/db/production_cache.sqlite3
    migrations_paths: db/cache_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |url| url.path = "/data/site/db/production_cache.sqlite3" } if ENV["DATABASE_URL"] %>
  queue:
    <<: *default
    database: /data/site/db/production_queue.sqlite3
    migrations_paths: db/queue_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |url| url.path = "/data/site/db/production_queue.sqlite3" } if ENV["DATABASE_URL"] %>
