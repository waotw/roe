# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  pragma:
    busy_timeout: 5000
    journal_mode: WAL
    synchronous: normal

development:
  primary:
    <<: *default
    database: <%= File.join(RoeSitePaths::SITE_DB_PATH, "development", "development.sqlite3") %>
  cable:
    <<: *default
    database: <%= File.join(RoeSitePaths::SITE_DB_PATH, "development", "development.sqlite3") %>
  cache:
    <<: *default
    database: <%= File.join(RoeSitePaths::SITE_DB_PATH, "development", "cache.sqlite3") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= File.join(RoeSitePaths::SITE_DB_PATH, "development", "queue.sqlite3") %>
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: storage/test.sqlite3
  cache:
    <<: *default
    database: storage/test_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/test_queue.sqlite3
    migrations_paths: db/queue_migrate

# Production databases stored in site/db/production/
# This folder is synced with /data/site/db/production/ on Fly.io
production:
  primary:
    <<: *default
    database: <%= File.join(RoeSitePaths::SITE_DB_PATH, "production", "production.sqlite3") %>
    url: <%= ENV["DATABASE_URL"] %>
  cable:
    <<: *default
    database: <%= File.join(RoeSitePaths::SITE_DB_PATH, "production", "cable.sqlite3") %>
    migrations_paths: db/cable_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |url| url.path = File.join(RoeSitePaths::SITE_DB_PATH, "production", "cable.sqlite3") } if ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    database: <%= File.join(RoeSitePaths::SITE_DB_PATH, "production", "cache.sqlite3") %>
    migrations_paths: db/cache_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |url| url.path = File.join(RoeSitePaths::SITE_DB_PATH, "production", "cache.sqlite3") } if ENV["DATABASE_URL"] %>
  queue:
    <<: *default
    database: <%= File.join(RoeSitePaths::SITE_DB_PATH, "production", "queue.sqlite3") %>
    migrations_paths: db/queue_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |url| url.path = File.join(RoeSitePaths::SITE_DB_PATH, "production", "queue.sqlite3") } if ENV["DATABASE_URL"] %>
