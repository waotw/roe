development:
  dispatchers:
    - polling_interval: 0.1
      batch_size: 10
  workers:
    - queues: "*"
      threads: 3
      processes: 1
  silence_polling: false

test:
  dispatchers:
    - polling_interval: 1
      batch_size: 1
  workers:
    - queues: "*"
      threads: 1
      processes: 1

production:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: 1
