# Kamal deployment config for Roe.
# Generated from site/system/global/deploy.yml — edit via Admin → Configuration → deploy.yml.
#
# Sensitive values live in .kamal/secrets (gitignored). The volume mapping
# for /data/site is used by SiteSync::KamalRsync — keep that path stable.

service: roe
image: benjaminwelch/roe

servers:
  web:
    - 165.245.170.200

# To enable SSL with a custom domain:
# 1. Point your domain's A record at the server
# 2. Uncomment the proxy block below and set your domain
# 3. Run: kamal proxy reboot
#
# proxy:
#   ssl: true
#   host: your-domain.com

registry:
  server: docker.io
  username: benjaminwelch
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true

volumes:
  - "roe_storage:/rails/storage"
  - "/var/lib/roe/site:/data/site"

asset_path: /rails/current/public/assets

builder:
  arch: amd64
  remote: ssh://root@165.245.170.200

boot:
  limit: 1
  wait: 0

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
